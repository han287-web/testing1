<!DOCTYPE html>
<html lang="en-US">
  <head>
  <meta charset="UTF-8">
    <title>demodemo</title>
    <style>
     *{
        box-sizing: border-box; /* padding no longer adds to element width */
      } 
    body {
    max-width: 1000px;
    background-color: yellow;
    padding: 5px;
    }
    
    .interac-sketch {
    padding: 0 40px;
    }
      canvas {
        display: block;
      }
  </style>   
  </head>
  
  <body>
    <h1>
      I WANT CHEESE
    </h1>
    <p>
      Cheese is love cheese is life cheese until I die
    </p>
<div id="interac-sketch">

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.min.js"></script>
<script>
  /* global p5 */
  const sketch = (p) => {
    const holder = document.getElementById('interac-sketch');
    p.setup = () => {
      p.createCanvas(holder.clientWidth, 600).parent(holder);
      p.background(154, 117, 240)
    }

    p.draw = () => {
      p.fill(20, 242, 224)
      p.ellipse(p.mouseX, p.mouseY, 50, 50)
    }
  }
  new p5(sketch)
</script>
  </div>
</body>
</html>
